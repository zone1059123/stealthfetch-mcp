[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stealthfetch-mcp"
version = "0.1.0"
description = "Local MCP server for web fetching and structured data extraction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "curl-cffi>=0.11,<1",
    "httpx>=0.27,<1",
    "markdownify>=1.1,<2",
    "mcp>=1.12,<2",
    "playwright>=1.51,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
stealthfetch-mcp = "stealthfetch_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
