[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stealthfetch-mcp"
version = "0.1.0"
description = "Clean web content reader with headless JS rendering and token-efficient Markdown and JSON-LD extraction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "curl_cffi>=0.10.0",
    "httpx>=0.27.0",
    "markdownify>=0.13.0",
    "mcp>=1.0.0,<2",
    "playwright>=1.50.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
stealthfetch-mcp = "stealthfetch_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
